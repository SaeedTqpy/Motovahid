name: WordPress + WooCommerce integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  wordpress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated local configuration
        run: cp .env.example .env
      - name: Start WordPress and MariaDB
        run: docker compose up -d --wait
      - name: Install WP-CLI inside the app container
        run: |
          curl -fLSs --retry 3 -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker compose cp /tmp/wp-cli.phar wordpress:/tmp/wp-cli.phar
          docker compose exec -T wordpress php /tmp/wp-cli.phar --info
      - name: Install WordPress and WooCommerce
        run: |
          docker compose exec -T wordpress php /tmp/wp-cli.phar core install \
            --url=http://localhost:8080 --title="Vahid Tuning Integration" \
            --admin_user=ciadmin --admin_password=ci-local-test-password \
            --admin_email=ci@example.invalid --skip-email --allow-root
          docker compose exec -T wordpress php /tmp/wp-cli.phar plugin install woocommerce --activate --allow-root
          docker compose exec -T wordpress php /tmp/wp-cli.phar theme activate vahidtuning --allow-root
          docker compose exec -T wordpress php /tmp/wp-cli.phar plugin activate vahidtuning-demo --allow-root
      - name: Import 18 Persian products with secure admin action
        run: |
          docker compose exec -T wordpress php /tmp/wp-cli.phar eval \
            'wp_set_current_user(1); $_REQUEST["vt_demo_nonce"] = wp_create_nonce("vt_import_demo"); do_action("admin_post_vt_import_demo");' --allow-root
      - name: Assert product catalog and real variations
        run: |
          docker compose exec -T wordpress php /tmp/wp-cli.phar eval '
            $count = (int) wp_count_posts("product")->publish;
            if ($count !== 18) { throw new Exception("Expected 18 demo products, got " . $count); }
            $id = wc_get_product_id_by_sku("VT-H001");
            $product = wc_get_product($id);
            if (!$product || !$product->is_type("variable")) { throw new Exception("Missing variable helmet"); }
            if (count($product->get_children()) !== 3) { throw new Exception("Helmet needs three size variations"); }
            if (get_option("woocommerce_currency") !== "IRT") { throw new Exception("Toman currency not configured"); }
            echo "Passed: 18 Persian products, three sizes, Toman";
          ' --allow-root
      - name: Assert storefront renders over HTTP
        run: |
          curl -fsSL --retry 8 --retry-delay 3 http://localhost:8080/ | grep -q "وحید تیونینگ"
          echo "Homepage rendered"
      - name: Verify shop, variable product, and customer pages
        run: |
          STORE_URLS=$(docker compose exec -T wordpress php /tmp/wp-cli.phar eval '
            $urls = array(
              "SHOP_URL" => vt_shop_url(),
              "PRODUCT_URL" => get_permalink(wc_get_product_id_by_sku("VT-H001")),
              "CART_URL" => wc_get_cart_url(),
              "CHECKOUT_URL" => wc_get_checkout_url(),
              "ACCOUNT_URL" => wc_get_page_permalink("myaccount"),
            );
            foreach ($urls as $key => $url) {
              if (!$url || is_wp_error($url)) { throw new Exception("Missing page URL: " . $key); }
              echo $key . "=" . $url . "\n";
            }
          ' --allow-root)
          printf '%s\n' "$STORE_URLS" | tr -d '\r' >> "$GITHUB_ENV"
          while IFS='=' read -r name url; do
            [ -n "$url" ] || exit 1
            case "$name" in
              SHOP_URL|PRODUCT_URL|CART_URL|CHECKOUT_URL|ACCOUNT_URL)
                curl -fsSL --retry 3 --retry-delay 2 "$url" -o "/tmp/${name}.html"
                grep -q "woodmart-pages.css" "/tmp/${name}.html" || { echo "Stylesheet absent: $name"; exit 1; }
                ;;
            esac
          done <<EOF
          $STORE_URLS
          EOF
          grep -q "vt-woodmart-shop-layout" /tmp/SHOP_URL.html
          grep -q "vt-pdp-hero" /tmp/PRODUCT_URL.html
          grep -q "variations_form" /tmp/PRODUCT_URL.html
          echo "Shop filters, variable product, cart, checkout and account rendered with consistent styles"
      - name: Capture desktop and mobile design screenshots
        run: |
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,4300 --screenshot=home-desktop.png http://localhost:8080/ 2>/dev/null
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,6800 --screenshot=home-mobile.png http://localhost:8080/ 2>/dev/null
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1024,4500 --screenshot=home-tablet.png http://localhost:8080/ 2>/dev/null
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,4300 --screenshot=shop-desktop.png "$SHOP_URL" 2>/dev/null
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,4300 --screenshot=product-desktop.png "$PRODUCT_URL" 2>/dev/null
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,4500 --screenshot=product-mobile.png "$PRODUCT_URL" 2>/dev/null
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,4000 --screenshot=cart-desktop.png "$CART_URL" 2>/dev/null
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,4000 --screenshot=account-desktop.png "$ACCOUNT_URL" 2>/dev/null
          else
            echo "Browser not installed; skipping visual capture."
          fi
      - name: Upload design screenshots
        uses: actions/upload-artifact@v4
        with:
          name: vahidtuning-design-preview
          path: |
            home-desktop.png
            home-mobile.png
            home-tablet.png
            shop-desktop.png
            product-desktop.png
            product-mobile.png
            cart-desktop.png
            account-desktop.png
          if-no-files-found: warn
      - name: Inspect logs on failure
        if: failure()
        run: docker compose logs --tail=160
      - name: Remove test containers
        if: always()
        run: docker compose down -v
