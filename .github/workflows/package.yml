name: Package WordPress installers
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package theme and demo importer separately
        run: |
          mkdir -p dist
          (cd wp-content/themes && zip -qr ../../dist/motovahid-theme.zip vahidtuning)
          (cd wp-content/plugins && zip -qr ../../dist/motovahid-demo-plugin.zip vahidtuning-demo)
          unzip -l dist/motovahid-theme.zip | head -15
          unzip -l dist/motovahid-demo-plugin.zip | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: motovahid-wordpress-installers
          path: dist/*.zip
          retention-days: 30
