name: vahidtuning
# Local development only. Do not deploy this Compose stack to the public internet as-is.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me-for-local-use}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root-for-local-use}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
  wordpress:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change-me-for-local-use}
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DEBUG: "${WP_DEBUG:-0}"
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/vahidtuning:/var/www/html/wp-content/themes/vahidtuning:ro
      - ./wp-content/plugins/vahidtuning-demo:/var/www/html/wp-content/plugins/vahidtuning-demo:ro
volumes:
  db_data:
  wordpress_data:
